name: TRACE validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Chromium for WebGL verification
        run: npx playwright install --with-deps chromium
      - name: Verify SONIC VISION and SOUND ACTION
        env:
          TRACE_CAPTURE: '0'
        run: |
          npm run preview -- --host 127.0.0.1 --port 32803 > /tmp/trace-preview.log 2>&1 &
          trace_preview_pid=$!
          trap 'kill "$trace_preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:32803/ > /dev/null; then break; fi
            sleep 0.25
          done
          npm run test:sonic
          npm run test:sound
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-sonic-sound-webgl-results
          path: |
            artifacts/sonic/results.json
            artifacts/sound/results.json
          if-no-files-found: ignore
